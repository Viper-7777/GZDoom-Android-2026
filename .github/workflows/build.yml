name: Android CI

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Android SDK & NDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platforms;android-36 build-tools;36.0.0 ndk;27.0.12077973'

    - name: Accept Licenses
      run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Debug APK
      env:
        ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.12077973
      run: ./gradlew :doom:assembleDebug --stacktrace --no-daemon

    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: gzdoom-android-apk
        path: doom/build/outputs/apk/debug/*.apk
